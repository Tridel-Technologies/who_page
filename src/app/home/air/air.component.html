<div class="air-background">
  <!-- Clouds -->
  <div *ngFor="let cloud of clouds"
       class="cloud animate-cloud"
       [ngStyle]="{
         top: cloud.top + '%',
         left: cloud.left + '%',
         animationDuration: cloud.duration + 's'
       }">

  <!-- Sparkles -->
  <div *ngFor="let sparkle of sparkles"

         top: sparkle.top + '%',
         left: sparkle.left + '%',
         animationDuration: sparkle.duration + 's',
         opacity: sparkle.opacity
       }">
  </div>
</div>
